[package]
name = "buddhilive-sandbox-core"
version = "0.1.0"
edition = "2021"
authors = ["BuddhiLive Team"]
description = "Core WebAssembly runtime and VirtualFS for in-browser Node.js sandbox"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "DedicatedWorkerGlobalScope",
    "MessagePort"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
