<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuddhiLive Sandbox Demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 1rem 1.5rem;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 9999px;
        background: #0ea5e9;
        color: white;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        padding: 1rem;
        overflow: hidden;
      }
      .panel {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-header {
        padding: 0.75rem 1rem;
        background: #0f172a;
        border-bottom: 1px solid #334155;
        font-weight: 600;
        font-size: 0.875rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .editor, .terminal {
        flex: 1;
        padding: 1rem;
        margin: 0;
        font-family: "Cascadia Code", "Fira Code", monospace;
        font-size: 0.875rem;
        color: #f8fafc;
        background: #090d16;
        overflow: auto;
        resize: none;
        border: none;
        outline: none;
      }
      .terminal {
        color: #38bdf8;
        white-space: pre-wrap;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.375rem 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
        cursor: pointer;
        font-weight: 500;
      }
      button:hover {
        background: #1d4ed8;
      }
      iframe#preview {
        flex: 1;
        border: none;
        background: white;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BuddhiLive Sandbox Demo <span class="badge">Client-Side Node.js</span></h1>
      <div id="status">Sandbox: Initializing...</div>
    </header>
    <main>
      <div class="panel">
        <div class="panel-header">
          <span>JavaScript File: /index.js</span>
          <button id="run-btn">Run Script</button>
        </div>
        <textarea id="code-editor" class="editor" spellcheck="false">// In-browser Node.js execution
console.log("Hello from inside the client-side Node.js Sandbox!");
console.log("Process version:", process.version);
console.log("Platform:", process.platform);
</textarea>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span>Terminal Output</span>
          <button id="clear-btn">Clear</button>
        </div>
        <pre id="terminal-output" class="terminal"></pre>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
